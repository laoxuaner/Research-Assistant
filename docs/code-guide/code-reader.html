eated_at)} · 绑定已保存的分析结果\n              \u003c/p\u003e\n            \u003c/div\u003e\n            \u003ca\n              className=\"button primary\"\n              href={\n                \"/api/projects/\" +\n                pid +\n                \"/reports/\" +\n                selected.id +\n                \"/download?format=zip\"\n              }\n            \u003e\n              \u003cDownload size={16} /\u003e\n              完整复现包\n            \u003c/a\u003e\n          \u003c/div\u003e\n          \u003cdiv className=\"download-row\"\u003e\n            {[\n              [\"md\", \"Markdown\"],\n              [\"csv\", \"统计 CSV\"],\n              [\"png\", \"图表 PNG\"],\n              [\"py\", \"复现脚本\"],\n              [\"json\", \"配置 JSON\"],\n            ].map(([f, t]) =\u003e (\n              \u003ca\n                className=\"button secondary small\"\n                key={f}\n                href={\n                  \"/api/projects/\" +\n                  pid +\n                  \"/reports/\" +\n                  selected.id +\n                  \"/download?format=\" +\n                  f\n                }\n              \u003e\n                \u003cDownload size={13} /\u003e\n                {t}\n              \u003c/a\u003e\n            ))}\n          \u003c/div\u003e\n          \u003cp className=\"tiny muted pad-x\"\u003e\n            完整包包含原始数据、配置、依赖版本和复现脚本。下载前请确认分享范围。\n          \u003c/p\u003e\n          \u003cdiv className=\"markdown-report rendered-report\"\u003e\n            \u003cMarkdown\n              remarkPlugins={[remarkGfm]}\n              skipHtml\n              components={{\n                img: ({ src, alt }) =\u003e {\n                  const kinds: Record\u003cstring, string\u003e = {\n                    \"plot.png\": \"points\",\n                    \"box.png\": \"box\",\n                    \"histogram.png\": \"hist\",\n                  };\n                  const kind = typeof src === \"string\" ? kinds[src] : undefined;\n                  return kind ? (\n                    \u003cimg\n                      src={\n                        \"/api/projects/\" +\n                        pid +\n                        \"/analyses/\" +\n                        selected.analysis_id +\n                        \"/plot.png?kind=\" +\n                        kind\n                      }\n                      alt={alt || \"实验图表\"}\n                      loading=\"lazy\"\n                    /\u003e\n                  ) : (\n                    \u003cspan className=\"muted\"\u003e\n                      [外部图片未自动加载：{alt || \"图片\"}]\n                    \u003c/span\u003e\n                  );\n                },\n                a: ({ href, children }) =\u003e (\n                  \u003ca href={href} target=\"_blank\" rel=\"noreferrer\"\u003e\n                    {children}\n                  \u003c/a\u003e\n                ),\n              }}\n            \u003e\n              {selected.markdown}\n            \u003c/Markdown\u003e\n          \u003c/div\u003e\n        \u003c/section\u003e\n      )}\n    \u003c/div\u003e\n  );\n}\nfunction SettingsView({\n  settings,\n  onChange,\n  notify,\n  pid,\n}: {\n  settings: Settings | null;\n  onChange: (s: Settings) =\u003e void;\n  notify: (s: string, e?: boolean) =\u003e void;\n  pid: string;\n}) {\n  const [busy, setBusy] = useState(false),\n    [consent, setConsent] = useState(false),\n    [indexStatus, setIndexStatus] = useState\u003cRecord\u003cstring, unknown\u003e | null\u003e(\n      null,\n    );\n  useEffect(() =\u003e {\n    if (pid)\n      api\u003cRecord\u003cstring, unknown\u003e\u003e(\"/projects/\" + pid + \"/embedding-status\")\n        .then(setIndexStatus)\n        .catch(() =\u003e {});\n  }, [pid]);\n  const toggle = async () =\u003e {\n    setBusy(true);\n    try {\n      const s = await api\u003cSettings\u003e(\"/settings\", {\n        method: \"PATCH\",\n        body: JSON.stringify({ ai_enabled: !settings?.ai_enabled }),\n      });\n      onChange(s);\n      notify(s.ai_enabled ? \"已启用外部模型调用\" : \"已关闭外部模型调用\");\n    } catch (e) {\n      notify((e as Error).message, true);\n    } finally {\n      setBusy(false);\n    }\n  };\n  const rebuild = async () =\u003e {\n    setBusy(true);\n    try {\n      await api(\"/projects/\" + pid + \"/embeddings/rebuild\", json({}));\n      notify(\"已提交向量索引重建，请在项目任务中查看进度\");\n    } catch (e) {\n      notify((e as Error).message, true);\n    } finally {\n      setBusy(false);\n    }\n  };\n  return !settings ? (\n    \u003cEmpty title=\"无法读取设置\"\u003e请检查后端服务并刷新页面。\u003c/Empty\u003e\n  ) : (\n    \u003cdiv className=\"settings-layout\"\u003e\n      \u003csection className=\"card\"\u003e\n        \u003cdiv className=\"card-heading\"\u003e\n          \u003cdiv\u003e\n            \u003ch2\u003e外部 AI 模型\u003c/h2\u003e\n            \u003cp className=\"tiny muted\"\u003e\n              聊天与向量服务分别配置，密钥仅由后端环境变量读取。\n            \u003c/p\u003e\n          \u003c/div\u003e\n          \u003cBadge tone={settings.ai_enabled ? \"teal\" : \"amber\"}\u003e\n            {settings.ai_enabled ? \"已启用\" : \"未启用\"}\n          \u003c/Badge\u003e\n        \u003c/div\u003e\n        \u003cdiv className=\"settings-body\"\u003e\n          \u003cdiv className=\"model-info\"\u003e\n            \u003cdiv className=\"stat-icon teal\"\u003e\n              \u003cMessageSquare size={20} /\u003e\n            \u003c/div\u003e\n            \u003cdiv\u003e\n              \u003ch3\u003e聊天模型\u003c/h3\u003e\n              \u003cp\u003e\n                {settings.chat_configured ? settings.chat_model : \"未配置模型\"}\n              \u003c/p\u003e\n              \u003csmall\u003e\n                {settings.chat_base_url ||\n                  \"请在 .env 中填写 AI_BASE_URL、AI_CHAT_MODEL、AI_API_KEY\"}\n              \u003c/small\u003e\n            \u003c/div\u003e\n            \u003cBadge tone={settings.chat_configured ? \"teal\" : \"neutral\"}\u003e\n              {settings.chat_configured ? \"已配置\" : \"未配置\"}\n            \u003c/Badge\u003e\n          \u003c/div\u003e\n          \u003cdiv className=\"model-info\"\u003e\n            \u003cdiv className=\"stat-icon blue\"\u003e\n              \u003cDatabase size={20} /\u003e\n            \u003c/div\u003e\n            \u003cdiv\u003e\n              \u003ch3\u003e向量模型\u003c/h3\u003e\n              \u003cp\u003e\n                {settings.embedding_configured\n                  ? settings.embedding_model\n                  : \"未配置模型\"}\n              \u003c/p\u003e\n              \u003csmall\u003e\n                {settings.embedding_base_url ||\n                  \"请在 .env 中填写 EMBEDDING_BASE_URL、EMBEDDING_MODEL、EMBEDDING_API_KEY\"}\n              \u003c/small\u003e\n            \u003c/div\u003e\n            \u003cBadge tone={settings.embedding_configured ? \"teal\" : \"neutral\"}\u003e\n              {settings.embedding_configured ? \"已配置\" : \"未配置\"}\n            \u003c/Badge\u003e\n          \u003c/div\u003e\n          \u003cAlert\u003e\n            \u003cstrong\u003e启用前了解资料外发范围\u003c/strong\u003e\n            \u003cp\u003e\n              问答、阅读卡和文献对比会向所选聊天服务发送研究问题与检索到的论文片段；分析建议会发送研究问题、字段信息、数据概况和少量预览行。向量索引与语义检索会向所选向量服务发送论文切块和检索词。模型只收到上述文本与数据概况，不上传原始\n              PDF 文件。完整表格不会发送给模型，密钥仅由后端读取。\n            \u003c/p\u003e\n            \u003cp\u003e\n              后端仅调用受校验的固定接口，模型输出不会作为代码运行。请先确认所选服务与你的资料使用要求相符。\n            \u003c/p\u003e\n          \u003c/Alert\u003e\n          {!settings.ai_enabled \u0026\u0026 (\n            \u003clabel className=\"checkbox\"\u003e\n              \u003cinput\n                type=\"checkbox\"\n                checked={consent}\n                onChange={(e) =\u003e setConsent(e.target.checked)}\n              /\u003e\n              我已了解发送范围，同意将上述资料发送到配置的模型服务。\n            \u003c/label\u003e\n          )}\n          \u003cbutton\n            className={\n              \"button \" + (settings.ai_enabled ? \"secondary\" : \"primary\")\n            }\n            disabled={\n              busy ||\n              (!settings.ai_enabled \u0026\u0026\n                (!consent ||\n                  (!settings.chat_configured \u0026\u0026\n                    !settings.embedding_configured)))\n            }\n            onClick={toggle}\n          \u003e\n            {busy \u0026\u0026 \u003cLoaderCircle className=\"spin\" size={15} /\u003e}{\" \"}\n            {settings.ai_enabled ? \"关闭外部 AI 调用\" : \"同意并启用 AI\"}\n          \u003c/button\u003e\n          \u003cp className=\"tiny muted\"\u003e\n            修改 .env 后需重启服务；未配置或关闭 AI\n            时，上传、阅读、关键词检索、统计和导出继续正常工作。\n          \u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/section\u003e\n      \u003csection className=\"card space-top\"\u003e\n        \u003cdiv className=\"card-heading\"\u003e\n          \u003cdiv\u003e\n            \u003ch2\u003e项目向量索引\u003c/h2\u003e\n            \u003cp className=\"tiny muted\"\u003e\n              模型、维度或版本发生变化后，应为当前项目重建索引。\n            \u003c/p\u003e\n          \u003c/div\u003e\n          \u003cbutton\n            className=\"button secondary\"\n            disabled={\n              busy ||\n              !pid ||\n              !settings.embedding_configured ||\n              !settings.ai_enabled\n            }\n            onClick={rebuild}\n          \u003e\n            \u003cRefreshCw size={15} /\u003e\n            重建当前项目索引\n          \u003c/button\u003e\n        \u003c/div\u003e\n        {indexStatus \u0026\u0026 (\n          \u003cdiv className=\"settings-body\"\u003e\n            \u003cdiv className=\"settings-metrics\"\u003e\n              \u003cp\u003e\n                可检索片段：\n                \u003cstrong\u003e{String(indexStatus.total_chunks ?? 0)}\u003c/strong\u003e\n              \u003c/p\u003e\n              \u003cp\u003e\n                当前模型已索引：\n                \u003cstrong\u003e{String(indexStatus.indexed_chunks ?? 0)}\u003c/strong\u003e\n              \u003c/p\u003e\n              \u003cp\u003e\n                索引状态：\n                \u003cstrong\u003e\n                  {indexStatus.needs_rebuild\n                    ? \"需要重建或补全\"\n                    : \"已覆盖当前片段\"}\n                \u003c/strong\u003e\n              \u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        )}\n      \u003c/section\u003e\n      \u003csection className=\"card space-top\"\u003e\n        \u003cdiv className=\"card-heading\"\u003e\n          \u003ch2\u003e本地资源限制\u003c/h2\u003e\n          \u003cBadge\u003e后端配置\u003c/Badge\u003e\n        \u003c/div\u003e\n        \u003cdiv className=\"settings-body\"\u003e\n          \u003cdiv className=\"settings-metrics\"\u003e\n            \u003cp\u003e\n              单文件大小：\n              \u003cstrong\u003e{String(settings.limits.max_upload_mb)} MB\u003c/strong\u003e\n            \u003c/p\u003e\n            \u003cp\u003e\n              PDF 页数上限：\n              \u003cstrong\u003e{String(settings.limits.max_pdf_pages)} 页\u003c/strong\u003e\n            \u003c/p\u003e\n            \u003cp\u003e\n              解析时限：\n              \u003cstrong\u003e\n                {String(settings.limits.parse_timeout_seconds)} 秒\n              \u003c/strong\u003e\n            \u003c/p\u003e\n            \u003cp\u003e\n              表格规模上限：\n              \u003cstrong\u003e\n                {String(settings.limits.max_dataset_rows)} 行 ×{\" \"}\n                {String(settings.limits.max_dataset_columns)} 列\n              \u003c/strong\u003e\n            \u003c/p\u003e\n          \u003c/div\u003e\n          \u003cp className=\"tiny muted\"\u003e\n            上传大小、页数、解析时限与模型调用限制均由后端环境变量管理。请参阅项目\n            README。\n          \u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/section\u003e\n    \u003c/div\u003e\n  );\n}\n", "lines": 2043, "sha256": "aeb4105f4851d38cfa87bd9b7ca3b42c9647999f9020bbe5662fa6cbda9ed50c", "category": "前端", "definitions": [{"name": "Project", "line": 38}, {"name": "Paper", "line": 39}, {"name": "Citation", "line": 40}, {"name": "Settings", "line": 41}, {"name": "Job", "line": 42}, {"name": "Report", "line": 43}, {"name": "Message", "line": 44}, {"name": "Conversation", "line": 45}, {"name": "ReadingField", "line": 46}, {"name": "Page", "line": 61}, {"name": "App", "line": 86}, {"name": "notify", "line": 104}, {"name": "t", "line": 109}, {"name": "refresh", "line": 112}, {"name": "loadProjects", "line": 113}, {"name": "list", "line": 114}, {"name": "t", "line": 146}, {"name": "project", "line": 153}, {"name": "importDemo", "line": 154}, {"name": "r", "line": 157}, {"name": "navigate", "line": 168}, {"name": "openCitation", "line": 172}, {"name": "onProjectSaved", "line": 173}, {"name": "ProjectForm", "line": 529}, {"name": "save", "line": 549}, {"name": "data", "line": 553}, {"name": "p", "line": 560}, {"name": "Overview", "line": 641}, {"name": "reloadOverview", "line": 665}, {"name": "timer", "line": 678}, {"name": "Library", "line": 891}, {"name": "upload", "line": 915}, {"name": "fd", "line": 917}, {"name": "r", "line": 921}, {"name": "search", "line": 940}, {"name": "r", "line": 945}, {"name": "retry", "line": 968}, {"name": "deletePaper", "line": 977}, {"name": "Scope", "line": 1271}, {"name": "Chat", "line": 1317}, {"name": "load", "line": 1336}, {"name": "ask", "line": 1346}, {"name": "q", "line": 1349}, {"name": "r", "line": 1354}, {"name": "Compare", "line": 1532}, {"name": "run", "line": 1550}, {"name": "r", "line": 1553}, {"name": "Reports", "line": 1667}, {"name": "kind", "line": 1781}, {"name": "SettingsView", "line": 1816}, {"name": "toggle", "line": 1838}, {"name": "s", "line": 1841}, {"name": "rebuild", "line": 1853}], "source_page": "source/32.md"}, {"path": "frontend/src/Experiments.tsx", "content": "import { makeHistogram } from \"./numeric\";\nimport {\n  useCallback,\n  useEffect,\n  useRef,\n  useState,\n  type FormEvent,\n} from \"react\";\nimport {\n  BarChart3,\n  Check,\n  ChevronDown,\n  Download,\n  FileSpreadsheet,\n  FlaskConical,\n  LoaderCircle,\n  Plus,\n  RefreshCw,\n  Save,\n  Scissors,\n  Sparkles,\n  Upload,\n  ArrowRight,\n} from \"lucide-react\";\nimport {\n  ResponsiveContainer,\n  ScatterChart,\n  Scatter,\n  XAxis,\n  YAxis,\n  CartesianGrid,\n  Tooltip,\n  BarChart,\n  Bar,\n  Cell,\n  Label,\n} from \"recharts\";\nimport {\n  api,\n  json,\n  date,\n  fmt,\n  type Analysis,\n  type AnalysisConfig,\n  type Dataset,\n  type Experiment,\n  type Paper,\n  type Report,\n  type Result,\n} from \"./api\";\nimport {\n  Alert,\n  Badge,\n  DataTable,\n  Empty,\n  Field,\n  Modal,\n  Spinner,\n} from \"./components\";\ntype Props = {\n  pid: string;\n  papers: Paper[];\n  revision: number;\n  refresh: () =\u003e void;\n  notify: (s: string, e?: boolean) =\u003e void;\n  onReports: () =\u003e void;\n};\nconst initialConfig: AnalysisConfig = {\n  group_column: \"\",\n  metric_column: \"\",\n  group_a: \"\",\n  group_b: \"\",\n  design: \"descriptive\",\n  experimental_unit: \"\",\n  missing_policy: \"error\",\n  alternative: \"two-sided\",\n  pair_column: \"\",\n  sample_id_column: \"\",\n  unit: \"\",\n  direction: \"higher\",\n  confirmed: false,\n};\nexport default function Experiments({\n  pid,\n  papers,\n  revision,\n  refresh,\n  notify,\n  onReports,\n}: Props) {\n  const [experiments, setExperiments] = useState\u003cExperiment[]\u003e([]),\n    [eid, setEid] = useState(\"\"),\n    [detail, setDetail] = useState\u003cExperiment | null\u003e(null),\n    [loading, setLoading] = useState(true),\n    [modal, setModal] = useState(false),\n    [datasetId, setDatasetId] = useState(\"\"),\n    [config, setConfig] = useState\u003cAnalysisConfig\u003e(initialConfig),\n    [analysis, setAnalysis] = useState\u003cAnalysis | null\u003e(null),\n    [file, setFile] = useState\u003cFile | null\u003e(null),\n    [sheet, setSheet] = useState(\"\"),\n    [busy, setBusy] = useState(false),\n    [error, setError] = useState(\"\"),\n    [clean, setClean] = useState(false),\n    [cleanColumns, setCleanColumns] = useState\u003cstring[]\u003e([]),\n    [dropDuplicates, setDropDuplicates] = useState(false),\n    [suggestion, setSuggestion] = useState\u003c{\n      suggestion: Partial\u003cAnalysisConfig\u003e;\n      explanation: string;\n      configured: boolean;\n    } | null\u003e(null),\n    [panel, setPanel] = useState(\"data\");\n  const selectedExperiment = useRef(\"\");\n  selectedExperiment.current = eid;\n  const detailRequest = useRef(0);\n  const loadDetail = useCallback(\n    async (id: string) =\u003e {\n      if (!id) return;\n      const request = ++detailRequest.current;\n      const d = await api\u003cExperiment\u003e(\n        \"/projects/\" + pid + \"/experiments/\" + id,\n      );\n      if (\n        request !== detailRequest.current ||\n        selectedExperiment.current !== id\n      )\n        return;\n      setDetail(d);\n      setDatasetId((old) =\u003e\n        d.datasets?.some((x) =\u003e x.id === old) ? old : d.datasets?.[0]?.id || \"\",\n      );\n      setAnalysis(\n        (old) =\u003e\n          d.analyses?.find((x) =\u003e x.id === old?.id) || d.analyses?.[0] || null,\n      );\n      return d;\n    },\n    [pid],\n  );\n  useEffect(() =\u003e {\n    setLoading(true);\n    api\u003cExperiment[]\u003e(\"/projects/\" + pid + \"/experiments\")\n      .then((list) =\u003e {\n        setExperiments(list);\n        setEid((old) =\u003e\n          list.some((e) =\u003e e.id === old) ? old : list[0]?.id || \"\",\n        );\n      })\n      .catch((e) =\u003e notify(e.message, true))\n      .finally(() =\u003e setLoading(false));\n  }, [pid, revision, notify]);\n  useEffect(() =\u003e {\n    setDetail(null);\n    setDatasetId(\"\");\n    setAnalysis(null);\n    setConfig(initialConfig);\n    setError(\"\");\n    setFile(null);\n    setSheet(\"\");\n    if (eid) loadDetail(eid).catch((e) =\u003e notify(e.message, true));\n  }, [eid, loadDetail, notify]);\n  const dataset = detail?.datasets?.find((d) =\u003e d.id === datasetId);\n  const update = (data: Partial\u003cAnalysisConfig\u003e) =\u003e\n    setConfig((c) =\u003e ({ ...c, ...data, confirmed: false }));\n  const groups =\n    dataset \u0026\u0026 config.group_column\n      ? [\n          ...new Set(\n            dataset.preview\n              .map((r) =\u003e String(r[config.group_column] ?? \"\"))\n              .filter(Boolean),\n          ),\n        ]\n      : [];\n  const upload = async () =\u003e {\n    if (!file || !eid) return;\n    const fd = new FormData();\n    fd.append(\"file\", file);\n    if (sheet) fd.append(\"sheet\", sheet);\n    setBusy(true);\n    setError(\"\");\n    try {\n      const d = await api\u003cDataset\u003e(\n        \"/projects/\" + pid + \"/experiments/\" + eid + \"/datasets\",\n        { method: \"POST\", body: fd },\n      );\n      await loadDetail(eid);\n      setDatasetId(d.id);\n      setSheet(d.sheet || \"\");\n      setConfig(initialConfig);\n      notify(\"数据版本已保存，原始文件保持不变\");\n      refresh();\n    } catch (e) {\n      setError((e as Error).message);\n    } finally {\n      setBusy(false);\n    }\n  };\n  const cleanData = async () =\u003e {\n    if (!dataset) return;\n    setBusy(true);\n    try {\n      const d = await api\u003cDataset\u003e(\n        \"/projects/\" +\n          pid +\n          \"/experiments/\" +\n          eid +\n          \"/datasets/\" +\n          dataset.id +\n          \"/clean\",\n        json({\n          drop_missing_columns: cleanColumns,\n          drop_duplicate_rows: dropDuplicates,\n        }),\n      );\n      await loadDetail(eid);\n      setDatasetId(d.id);\n      setClean(false);\n      setConfig(initialConfig);\n      notify(\"清洗结果已保存为独立版本\");\n    } catch (e) {\n      notify((e as Error).message, true);\n    } finally {\n      setBusy(false);\n    }\n  };\n  const run = async (e: FormEvent) =\u003e {\n    e.preventDefault();\n    setBusy(true);\n    setError(\"\");\n    try {\n      const a = await api\u003cAnalysis\u003e(\n        \"/projects/\" + pid + \"/experiments/\" + eid + \"/analyses\",\n        json({ dataset_id: datasetId, config }),\n      );\n      setAnalysis(a);\n      setPanel(\"result\");\n      await loadDetail(eid);\n      notify(\"统计结果已保存，并绑定当前数据版本\");\n    } catch (e) {\n      setError((e as Error).message);\n    } finally {\n      setBusy(false);\n    }\n  };\n  const suggest = async () =\u003e {\n    setBusy(true);\n    try {\n      const r = await api\u003c{\n        suggestion: Partial\u003cAnalysisConfig\u003e;\n        explanation: string;\n        configured: boolean;\n      }\u003e(\n        \"/projects/\" + pid + \"/experiments/\" + eid + \"/suggest\",\n        json({\n          dataset_id: datasetId,\n          question:\n            detail?.hypothesis || \"请根据数据字段给出可供审阅的分析配置建议\",\n        }),\n      );\n      setSuggestion(r);\n      if (!r.configured) notify(r.explanation);\n    } catch (e) {\n      notify((e as Error).message, true);\n    } finally {\n      setBusy(false);\n    }\n  };\n  const createReport = async () =\u003e {\n    if (!analysis) return;\n    setBusy(true);\n    try {\n      await api\u003cReport\u003e(\n        \"/projects/\" + pid + \"/reports\",\n        json({\n          analysis_id: analysis.id,\n          title: (detail?.name || \"实验\") + \" · 研究报告\",\n        }),\n      );\n      refresh();\n      notify(\"研究报告已生成，包含真实统计与复现包\");\n      onReports();\n    } catch (e) {\n      notify((e as Error).message, true);\n    } finally {\n      setBusy(false);\n    }\n  };\n  const selector = (\n    label: string,\n    key: \"group_column\" | \"metric_column\" | \"sample_id_column\" | \"pair_column\",\n    required = false,\n  ) =\u003e (\n    \u003cField label={label}\u003e\n      \u003cselect\n        value={config[key] || \"\"}\n        required={required}\n        onChange={(e) =\u003e update({ [key]: e.target.value })}\n      \u003e\n        \u003coption value=\"\"\u003e请选择列\u003c/option\u003e\n        {dataset?.columns.map((c) =\u003e (\n          \u003coption key={c} value={c}\u003e\n            {c}\n          \u003c/option\u003e\n
