                     onChange={(e) =\u003e\n                                  update({\n                                    alternative: e.target\n                                      .value as AnalysisConfig[\"alternative\"],\n                                  })\n                                }\n                              \u003e\n                                \u003coption value=\"two-sided\"\u003e\n                                  双侧 · B 与 A 不同\n                                \u003c/option\u003e\n                                \u003coption value=\"greater\"\u003e单侧 · B \u0026gt; A\u003c/option\u003e\n                                \u003coption value=\"less\"\u003e单侧 · B \u0026lt; A\u003c/option\u003e\n                              \u003c/select\u003e\n                            \u003c/Field\u003e\n                          \u003c/div\u003e\n                          \u003cdatalist id=\"analysis-groups\"\u003e\n                            {groups.map((g) =\u003e (\n                              \u003coption key={g} value={g} /\u003e\n                            ))}\n                          \u003c/datalist\u003e\n                          \u003cAlert\u003e\n                            所有差值统一为 B − A；相对变化以 |A|\n                            为分母。每次只检验一个主要指标。均值差的 95%\n                            区间、统计显著性与实际价值需要分别解释。\n                          \u003c/Alert\u003e\n                          \u003clabel className=\"checkbox confirmation\"\u003e\n                            \u003cinput\n                              type=\"checkbox\"\n                              required\n                              checked={config.confirmed}\n                              onChange={(e) =\u003e\n                                setConfig({\n                                  ...config,\n                                  confirmed: e.target.checked,\n                                })\n                              }\n                            /\u003e\n                            我已核对数据版本、实验单位、独立/配对设计、两组对象与缺失值处理，同意执行以上配置。\n                          \u003c/label\u003e\n                          \u003cdiv className=\"form-actions\"\u003e\n                            \u003cspan className=\"tiny muted\"\u003e\n                              统计计算由后端确定性函数执行\n                            \u003c/span\u003e\n                            \u003cbutton\n                              className=\"button primary\"\n                              disabled={busy || !config.confirmed}\n                            \u003e\n                              {busy ? (\n                                \u003cLoaderCircle size={16} className=\"spin\" /\u003e\n                              ) : (\n                                \u003cBarChart3 size={16} /\u003e\n                              )}\n                              运行并保存分析\n                            \u003c/button\u003e\n                          \u003c/div\u003e\n                        \u003c/form\u003e\n                      \u003c/section\u003e\n                    \u003c/\u003e\n                  )}\n                  {error \u0026\u0026 \u003cAlert tone=\"error\"\u003e{error}\u003c/Alert\u003e}\n                \u003c/\u003e\n              ) : (\n                \u003c\u003e\n                  {detail.analyses?.length ? (\n                    \u003cdiv className=\"result-selector\"\u003e\n                      \u003cField label=\"已保存的分析记录\"\u003e\n                        \u003cselect\n                          value={analysis?.id || \"\"}\n                          onChange={(e) =\u003e\n                            setAnalysis(\n                              detail.analyses?.find(\n                                (a) =\u003e a.id === e.target.value,\n                              ) || null,\n                            )\n                          }\n                        \u003e\n                          {detail.analyses.map((a) =\u003e (\n                            \u003coption value={a.id} key={a.id}\u003e\n                              {date(a.created_at)} · {a.config.metric_column} ·{\" \"}\n                              {a.config.design} · 数据{\" \"}\n                              {a.dataset_id.slice(0, 8)}\n                            \u003c/option\u003e\n                          ))}\n                        \u003c/select\u003e\n                      \u003c/Field\u003e\n                      \u003cbutton\n                        className=\"button primary\"\n                        disabled={busy || !analysis}\n                        onClick={createReport}\n                      \u003e\n                        \u003cFileSpreadsheet size={16} /\u003e\n                        生成研究报告\n                      \u003c/button\u003e\n                    \u003c/div\u003e\n                  ) : null}\n                  {analysis ? (\n                    \u003cAnalysisResult analysis={analysis} pid={pid} /\u003e\n                  ) : (\n                    \u003cdiv className=\"card\"\u003e\n                      \u003cEmpty\n                        title=\"尚未执行分析\"\n                        action={\n                          \u003cbutton\n                            className=\"button secondary\"\n                            onClick={() =\u003e setPanel(\"data\")}\n                          \u003e\n                            配置数据与分析\n                            \u003cArrowRight size={15} /\u003e\n                          \u003c/button\u003e\n                        }\n                      \u003e\n                        结果始终绑定一次已确认的配置和一个确定的数据版本。\n                      \u003c/Empty\u003e\n                    \u003c/div\u003e\n                  )}\n                \u003c/\u003e\n              )}\n            \u003c/\u003e\n          ) : (\n            \u003cSpinner label=\"正在读取实验记录…\" /\u003e\n          )}\n        \u003c/\u003e\n      )}\n      {modal \u0026\u0026 (\n        \u003cExperimentForm\n          pid={pid}\n          papers={papers}\n          onClose={() =\u003e setModal(false)}\n          notify={notify}\n          onSaved={(e) =\u003e {\n            setExperiments((list) =\u003e [e, ...list]);\n            setEid(e.id);\n            setModal(false);\n            refresh();\n          }}\n        /\u003e\n      )}\n      {clean \u0026\u0026 dataset \u0026\u0026 (\n        \u003cModal title=\"清洗并保存为新版本\" onClose={() =\u003e setClean(false)}\u003e\n          \u003cdiv className=\"form-body\"\u003e\n            \u003cAlert\u003e\n              原始数据不会改变。选择规则后，将保存独立数据版本与处理记录。\n            \u003c/Alert\u003e\n            \u003ch4\u003e删除以下列中含缺失值的行\u003c/h4\u003e\n            \u003cdiv className=\"checkbox-grid\"\u003e\n              {dataset.columns.map((c) =\u003e (\n                \u003clabel className=\"checkbox\" key={c}\u003e\n                  \u003cinput\n                    type=\"checkbox\"\n                    checked={cleanColumns.includes(c)}\n                    onChange={(e) =\u003e\n                      setCleanColumns(\n                        e.target.checked\n                          ? [...cleanColumns, c]\n                          : cleanColumns.filter((v) =\u003e v !== c),\n                      )\n                    }\n                  /\u003e\n                  {c}\n                \u003c/label\u003e\n              ))}\n            \u003c/div\u003e\n            \u003clabel className=\"checkbox\"\u003e\n              \u003cinput\n                type=\"checkbox\"\n                checked={dropDuplicates}\n                onChange={(e) =\u003e setDropDuplicates(e.target.checked)}\n              /\u003e\n              删除完全相同的重复行，保留首次出现\n            \u003c/label\u003e\n            \u003cp className=\"tiny muted\"\u003e\n              异常值不自动删除；不会填补数值或改变单位。\n            \u003c/p\u003e\n            \u003cdiv className=\"form-actions\"\u003e\n              \u003cbutton\n                className=\"button secondary\"\n                onClick={() =\u003e setClean(false)}\n              \u003e\n                取消\n              \u003c/button\u003e\n              \u003cbutton\n                className=\"button primary\"\n                disabled={busy || (!dropDuplicates \u0026\u0026 !cleanColumns.length)}\n                onClick={cleanData}\n              \u003e\n                保存新版本\n              \u003c/button\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/Modal\u003e\n      )}\n      {suggestion \u0026\u0026 (\n        \u003cModal\n          title=\"分析配置建议 · 待人工核对\"\n          onClose={() =\u003e setSuggestion(null)}\n        \u003e\n          \u003cdiv className=\"form-body\"\u003e\n            \u003cAlert\u003e{suggestion.explanation}\u003c/Alert\u003e\n            {suggestion.configured \u0026\u0026 (\n              \u003c\u003e\n                \u003cpre className=\"json-preview\"\u003e\n                  {JSON.stringify(suggestion.suggestion, null, 2)}\n                \u003c/pre\u003e\n                \u003cp className=\"muted\"\u003e\n                  导入建议只填写表单，不会执行。请逐项核对后，勾选确认并点击运行。\n                \u003c/p\u003e\n                \u003cdiv className=\"form-actions\"\u003e\n                  \u003cbutton\n                    className=\"button secondary\"\n                    onClick={() =\u003e setSuggestion(null)}\n                  \u003e\n                    关闭\n                  \u003c/button\u003e\n                  \u003cbutton\n                    className=\"button primary\"\n                    onClick={() =\u003e {\n                      setConfig((c) =\u003e ({\n                        ...c,\n                        ...suggestion.suggestion,\n                        confirmed: false,\n                      }));\n                      setSuggestion(null);\n                    }}\n                  \u003e\n                    填入表单，继续核对\n                  \u003c/button\u003e\n                \u003c/div\u003e\n              \u003c/\u003e\n            )}\n          \u003c/div\u003e\n        \u003c/Modal\u003e\n      )}\n    \u003c/\u003e\n  );\n}\nfunction ExperimentForm({\n  pid,\n  papers,\n  onClose,\n  onSaved,\n  notify,\n}: {\n  pid: string;\n  papers: Paper[];\n  onClose: () =\u003e void;\n  onSaved: (e: Experiment) =\u003e void;\n  notify: (s: string, e?: boolean) =\u003e void;\n}) {\n  const [form, setForm] = useState({\n      name: \"\",\n      hypothesis: \"\",\n      paper_ids: [] as string[],\n      conditions: \"\",\n      parameters: \"\",\n      notes: \"\",\n    }),\n    [busy, setBusy] = useState(false);\n  const save = async (e: FormEvent) =\u003e {\n    e.preventDefault();\n    setBusy(true);\n    try {\n      const x = await api\u003cExperiment\u003e(\n        \"/projects/\" + pid + \"/experiments\",\n        json(form),\n      );\n      onSaved(x);\n      notify(\"实验记录已创建\");\n    } catch (e) {\n      notify((e as Error).message, true);\n    } finally {\n      setBusy(false);\n    }\n  };\n  return (\n    \u003cModal title=\"创建实验记录\" onClose={onClose}\u003e\n      \u003cform className=\"form-body\" onSubmit={save}\u003e\n        \u003cField label=\"实验名称\"\u003e\n          \u003cinput\n            required\n            autoFocus\n            maxLength={160}\n            value={form.name}\n            onChange={(e) =\u003e setForm({ ...form, name: e.target.value })}\n            placeholder=\"例如：数据增强策略的独立重复试验\"\n          /\u003e\n        \u003c/Field\u003e\n        \u003cField label=\"研究假设\"\u003e\n          \u003ctextarea\n            rows={3}\n            value={form.hypothesis}\n            onChange={(e) =\u003e setForm({ ...form, hypothesis: e.target.value })}\n          /\u003e\n        \u003c/Field\u003e\n        \u003cdiv className=\"form-grid\"\u003e\n          \u003cField label=\"实验条件\"\u003e\n            \u003ctextarea\n              rows={3}\n              value={form.conditions}\n              onChange={(e) =\u003e setForm({ ...form, conditions: e.target.value })}\n            /\u003e\n          \u003c/Field\u003e\n          \u003cField label=\"参数\"\u003e\n            \u003ctextarea\n              rows={3}\n              value={form.parameters}\n              onChange={(e) =\u003e setForm({ ...form, parameters: e.target.value })}\n            /\u003e\n          \u003c/Field\u003e\n        \u003c/div\u003e\n        {papers.length \u003e 0 \u0026\u0026 (\n          \u003cdetails\u003e\n            \u003csummary className=\"text-button\"\u003e\n              关联论文（可选）\n              \u003cChevronDown size={13} /\u003e\n            \u003c/summary\u003e\n            \u003cdiv className=\"scope-options inline\"\u003e\n              {papers.map((p) =\u003e (\n                \u003clabel className=\"checkbox\" key={p.id}\u003e\n                  \u003cinput\n                    type=\"checkbox\"\n                    checked={form.paper_ids.includes(p.id)}\n                    onChange={(e) =\u003e\n                      setForm({\n                        ...form,\n                        paper_ids: e.target.checked\n                          ? [...form.paper_ids, p.id]\n                          : form.paper_ids.filter((id) =\u003e id !== p.id),\n                      })\n                    }\n                  /\u003e\n                  {p.title}\n                \u003c/label\u003e\n              ))}\n            \u003c/div\u003e\n          \u003c/details\u003e\n        )}\n        \u003cField label=\"备注\"\u003e\n          \u003ctextarea\n            rows={2}\n            value={form.notes}\n            onChange={(e) =\u003e setForm({ ...form, notes: e.target.value })}\n          /\u003e\n        \u003c/Field\u003e\n        \u003cdiv className=\"form-actions\"\u003e\n          \u003cbutton className=\"button secondary\" type=\"button\" onClick={onClose}\u003e\n            取消\n          \u003c/button\u003e\n          \u003cbutton className=\"button primary\" disabled={busy}\u003e\n            {busy ? (\n              \u003cLoaderCircle size={16} className=\"spin\" /\u003e\n            ) : (\n              \u003cCheck size={16} /\u003e\n            )}\n            创建实验\n          \u003c/button\u003e\n        \u003c/div\u003e\n      \u003c/form\u003e\n    \u003c/Modal\u003e\n  );\n}\nfunction Quality({ dataset }: { dataset: Dataset }) {\n  const quality = dataset.quality || {};\n  const columns = Array.isArray(quality.columns)\n    ? (quality.columns as Record\u003cstring, unknown\u003e[])\n    : [];\n  const duplicate = quality.duplicate_rows ?? quality.duplicates ?? 0;\n  return (\n    \u003cdiv className=\"quality\"\u003e\n      \u003cdiv className=\"row wrap\"\u003e\n        \u003cBadge tone=\"blue\"\u003e{dataset.row_count} 行观测\u003c/Badge\u003e\n        \u003cBadge\u003e完全重复行：{fmt(duplicate)}\u003c/Badge\u003e\n        {dataset.sheet \u0026\u0026 \u003cBadge\u003e工作表：{dataset.sheet}\u003c/Badge\u003e}\n        \u003cspan className=\"tiny muted\"\u003e完整性检查针对全量数据\u003c/span\u003e\n      \u003c/div\u003e\n      {columns.length \u003e 0 \u0026\u0026 (\n        \u003cdetails\u003e\n          \u003csummary\u003e\n            查看各列缺失、数值与异常值情况 \u003cChevronDown size={13} /\u003e\n          \u003c/summary\u003e\n          \u003cDataTable rows={columns} columns={Object.keys(columns[0])} /\u003e\n        \u003c/details\u003e\n      )}\n      {!columns.length \u0026\u0026 (\n        \u003cdetails\u003e\n          \u003csummary\u003e\n            查看数据质量详情\n            \u003cChevronDown size={13} /\u003e\n          \u003c/summary\u003e\n          \u003cpre className=\"json-preview\"\u003e{JSON.stringify(quality, null, 2)}\u003c/pre\u003e\n        \u003c/details\u003e\n      )}\n    \u003c/div\u003e\n  );\n}\nfunction AnalysisResult({\n  analysis,\n  pid,\n}: {\n  analysis: Analysis;\n  pid: string;\n}) {\n  const [plot, setPlot] = useState\u003c\"points\" | \"box\" | \"hist\"\u003e(\"points\");\n  const r = analysis.result,\n    c = r.comparison || {},\n    cfg = analysis.config;\n  return (\n    \u003c\u003e\n      \u003cdiv className=\"analysis-provenance\"\u003e\n        \u003cCheck size={16} /\u003e\n        \u003cspan\u003e\n          已保存分析 · 数据版本{\" \"}\n          \u003cstrong\u003e{analysis.dataset_id.slice(0, 12)}\u003c/strong\u003e ·{\" \"}\n          {date(analysis.created_at)}\n        \u003c/span\u003e\n        \u003cBadge\u003e\n          {cfg.design === \"independent\"\n            ? \"独立样本\"\n            : cfg.design === \"paired\"\n              ? \"配对样本\"\n              : \"描述统计\"}\n        \u003c/Badge\u003e\n      \u003c/div\u003e\n      {r.warnings?.map((w, i) =\u003e (\n        \u003cAlert tone=\"warning\" key={i}\u003e\n          {w}\n        \u003c/Alert\u003e\n      ))}\n      {c.reason \u0026\u0026 (\n        \u003cAlert tone={c.status === \"ok\" ? \"info\" : \"warning\"}\u003e{c.reason}\u003c/Alert\u003e\n      )}\n      \u003cdiv className=\"stats-grid result-stats\"\u003e\n        {[\n          { label: \"均值差 B − A\", value: c.difference, unit: cfg.unit },\n          {\n            label: \"95% 置信区间\",\n            value:\n              c.ci_low != null \u0026\u0026 c.ci_high != null\n                ? \"[\" + fmt(c.ci_low) + \", \" + fmt(c.ci_high) + \"]\"\n                : \"—\",\n            unit: cfg.unit,\n          },\n          {\n            label: \"p 值\",\n            value: c.pvalue,\n            unit: cfg.alternative === \"two-sided\" ? \"双侧检验\" : \"单侧检验\",\n          },\n          {\n            label: \"相对变化\",\n            value: c.relative_change_percent,\n            unit: \"% · 分母为 |A|\",\n          },\n        ].map((v) =\u003e (\n          \u003cdiv className=\"stat-card\" key={v.label}\u003e\n            \u003cdiv\u003e\n              \u003cspan\u003e{v.label}\u003c/span\u003e\n              \u003cstrong className=\"number\"\u003e\n                {typeof v.value === \"string\" ? v.value : fmt(v.value)}\n              \u003c/strong\u003e\n              \u003csmall\u003e{v.unit || \"无量纲\"}\u003c/small\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        ))}\n      \u003c/div\u003e\n      \u003cdiv className=\"card\"\u003e\n        \u003cdiv className=\"card-heading\"\u003e\n          \u003cdiv\u003e\n            \u003ch2\u003e各组描述统计\u003c/h2\u003e\n            \u003cp className=\"tiny muted\"\u003e\n              {cfg.metric_column} {cfg.unit ? \"(\" + cfg.unit + \")\" : \"\"} ·\n              每组有效样本量独立列出 · 标准差采用样本标准差\n            \u003c/p\u003e\n          \u003c/div\u003e\n          \u003cBadge\u003e{c.method || \"描述统计\"}\u003c/Badge\u003e\n        \u003c/div\u003e\n        \u003cDataTable\n          rows={r.summary as unknown as Record\u003cstring, unknown\u003e[]}\n          columns={[\"group\", \"n\", \"mean\", \"median\", \"std\", \"min\", \"max\"]}\n        /\u003e\n      \u003c/div\u003e\n      \u003cdiv className=\"card space-top\"\u003e\n        \u003cdiv className=\"card-heading\"\u003e\n          \u003cdiv className=\"tabs plot-tabs\"\u003e\n            {[\n              [\"points\", \"原始数据点\"],\n              [\"box\", \"箱线图\"],\n              [\"hist\", \"分布图\"],\n            ].map(([v, t]) =\u003e (\n              \u003cbutton\n                className={plot === v ? \"active\" : \"\"}\n                key={v}\n                onClick={() =\u003e setPlot(v as typeof plot)}\n              \u003e\n                {t}\n              \u003c/button\u003e\n            ))}\n          \u003c/div\u003e\n          \u003ca\n            className=\"button secondary small\"\n            href={\n              \"/api/projects/\" +\n              pid +\n              \"/analyses/\" +\n              analysis.id +\n              \"/plot.png?kind=\" +\n              plot\n            }\n            download\n          \u003e\n            \u003cDownload size={14} /\u003e\n            导出 PNG\n          \u003c/a\u003e\n        \u003c/div\u003e\n        \u003cdiv className=\"chart\"\u003e\n          \u003cInteractivePlot\n            result={r}\n            kind={plot}\n            unit={cfg.unit}\n            metric={cfg.metric_column}\n          /\u003e\n        \u003c/div\u003e\n        \u003cp className=\"tiny muted pad-x\"\u003e\n          {plot === \"points\"\n            ? \"每个点代表一个有效观测；横向偏移仅用于展示，不改变数据。\"\n            : plot === \"box\"\n              ? \"箱体：第 25–75 百分位；中线：中位数；须：1.5×IQR 范围内数据；点：异常值。\"\n              : \"直方图使用共同区间展示两组分布，纵轴为频数。\"}{\" \"}\n          图表不包含均值误差线。\n        \u003c/p\u003e\n      \u003c/div\u003e\n      \u003cAlert\u003e\n        统计显著性不能直接解释为实际价值或因果关系。指标改善方向：\n        {cfg.direction === \"higher\" ? \"越大越好\" : \"越小越好\"}\n        ；实际意义仍需结合实验设计和领域判断。\n      \u003c/Alert\u003e\n      \u003cdetails className=\"card space-top\"\u003e\n        \u003csummary className=\"card-heading\"\u003e\n          \u003ch3\u003e分析配置与排除记录\u003c/h3\u003e\n          \u003cChevronDown size={16} /\u003e\n        \u003c/summary\u003e\n        \u003cdiv className=\"two-col pad\"\u003e\n          \u003cpre className=\"json-preview\"\u003e{JSON.stringify(cfg, null, 2)}\u003c/pre\u003e\n          \u003cpre className=\"json-preview\"\u003e\n            {JSON.stringify(\n              { exclusions: r.exclusions, status: c.status, reason: c.reason },\n              null,\n              2,\n            )}\n          \u003c/pre\u003e\n        \u003c/div\u003e\n      \u003c/details\u003e\n    \u003c/\u003e\n  );\n}\nfunction quantile(values: number[], q: number) {\n  const pos = (values.length - 1) * q,\n    base = Math.floor(pos),\n    rest = pos - base;\n  return (\n    values[base] + ((values[base + 1] ?? values[base]) - values[base]) * rest\n  );\n}\nfunction InteractivePlot({\n  result,\n  kind,\n  unit,\n  metric,\n}: {\n  result: Result;\n  kind: \"points\" | \"box\" | \"hist\";\n  unit: string;\n  metric: string;\n}) {\n  const groups = [...new Set(result.points.map((p) =\u003e p.group))];\n  const colors = [\"#278d83\", \"#6681d7\", \"#bb8b4b\", \"#a16bab\"];\n  const label = metric + (unit ? \" (\" + unit + \")\" : \"\");\n  if (!result.points.length) return \u003cEmpty title=\"没有可显示的有效数据\" /\u003e;\n  if (kind === \"points\") {\n    const data = result.points.map((p, i) =\u003e ({\n      ...p,\n      x: groups.indexOf(p.group) + 1 + (((i * 37) % 19) / 19 - 0.5) * 0.2,\n    }));\n    return (\n      \u003cResponsiveContainer width=\"100%\" height={330}\u003e\n        \u003cScatterChart margin={{ top: 20, right: 30, left: 16, bottom: 36 }}\u003e\n          \u003cCartesianGrid strokeDasharray=\"3 5\" stroke=\"#e7edee\" /\u003e\n          \u003cXAxis\n            type=\"number\"\n            dataKey=\"x\"\n            ticks={groups.map((_, i) =\u003e i + 1)}\n            domain={[0.5, groups.length + 0.5]}\n            tickFormatter={(v) =\u003e groups[Math.round(v) - 1] || \"\"}\n          /\u003e\n          \u003cYAxis\n            dataKey=\"value\"\n            type=\"number\"\n            width={65}\n            domain={[\"auto\", \"auto\"]}\n          \u003e\n            \u003cLabel\n              value={label}\n              angle={-90}\n              position=\"insideLeft\"\n              style={{ textAnchor: \"middle\", fill: \"#64777b\" }}\n            /\u003e\n          \u003c/YAxis\u003e\n          \u003cTooltip\n            cursor={{ strokeDasharray: \"3 3\" }}\n            content={({ active, payload }) =\u003e\n              active \u0026\u0026 payload?.length ? (\n                \u003cdiv className=\"chart-tooltip\"\u003e\n                  \u003cstrong\u003e{payload[0].payload.group}\u003c/strong\u003e\n                  \u003cp\u003e\n                    {label}: {fmt(payload[0].payload.value)}\n                  \u003c/p\u003e\n                  {payload[0].payload.pair_id \u0026\u0026 (\n                    \u003csmall\u003eID: {payload[0].payload.pair_id}\u003c/small\u003e\n                  )}\n                \u003c/div\u003e\n              ) : null\n            }\n          /\u003e\n          \u003cScatter data={data} isAnimationActive={false}\u003e\n            {data.map((p, i) =\u003e (\n              \u003cCell\n                key={i}\n                fill={colors[groups.indexOf(p.group) % colors.length]}\n                fillOpacity={0.78}\n              /\u003e\n            ))}\n          \u003c/Scatter\u003e\n        \u003c/ScatterChart\u003e\n      \u003c/ResponsiveContainer\u003e\n    );\n  }\n  if (kind === \"hist\") {\n    const values = result.points.map((p) =\u003e p.value),\n      count = Math.min(12, Math.max(3, Math.ceil(Math.sqrt(values.length)))),\n      hist = makeHistogram(values, count);\n    const bins = hist.bins.map((b) =\u003e {\n      const record: Record\u003cstring, number | string\u003e = { range: b.range };\n      groups.forEach((_, i) =\u003e (record[\"g\" + i] = 0));\n      return record;\n    });\n    result.points.forEach((p, i) =\u003e {\n      const index = hist.binIndices[i];\n      if (index \u003e= 0) {\n        const key = \"g\" + groups.indexOf(p.group);\n        bins[index][key] = Number(bins[index][key]) + 1;\n      }\n    });\n    return (\n      \u003cResponsiveContainer width=\"100%\" height={330}\u003e\n        \u003cBarChart\n          data={bins}\n          margin={{ top: 20, right: 25, left: 5, bottom: 50 }}\n        \u003e\n          \u003cCartesianGrid strokeDasharray=\"3 5\" vertical={false} /\u003e\n          \u003cXAxis\n            dataKey=\"range\"\n            angle={-25}\n            textAnchor=\"end\"\n            height={65}\n            tick={{ fontSize: 10 }}\n          /\u003e\n          \u003cYAxis allowDecimals={false}\u003e\n            \u003cLabel value=\"频数\" angle={-90} position=\"insideLeft\" /\u003e\n          \u003c/YAxis\u003e\n          \u003cTooltip contentStyle={{ borderRadius: 10, fontSize: 12 }} /\u003e\n          {groups.map((g, i) =\u003e (\n            \u003cBar\n              isAnimationActive={false}\n              name={g}\n              dataKey={\"g\" + i}\n              fill={colors[i % colors.length]}\n              key={g}\n              radius={[3, 3, 0, 0]}\n            /\u003e\n          ))}\n        \u003c/BarChart\u003e\n      \u003c/ResponsiveContainer\u003e\n    );\n  }\n  const all = result.points.map((p) =\u003e p.value),\n    min = all.reduce((a, v) =\u003e Math.min(a, v), Infinity),\n    max = all.reduce((a, v) =\u003e Math.max(a, v), -Infinity),\n    span = max - min || 1,\n    padding = span * 0.15;\n  const y = (v: number) =\u003e\n    275 - ((v - min + padding) / (span + 2 * padding)) * 235;\n  return (\n    \u003cdiv className=\"box-chart\"\u003e\n      \u003csvg viewBox=\"0 0 800 330\" role=\"img\" aria-label={label + \" 箱线图\"}\u003e\n        {Array.from({ length: 5 }, (_, i) =\u003e {\n          const v = min + ((max - min) * i) / 4;\n          return (\n            \u003cg key={i}\u003e\n              \u003cline\n                x1=\"75\"\n                y1={y(v)}\n                x2=\"765\"\n                y2={y(v)}\n                stroke=\"#e7edee\"\n                strokeDasharray=\"3 5\"\n              /\u003e\n              \u003ctext\n                x=\"64\"\n                y={y(v) + 4}\n                textAnchor=\"end\"\n                fill=\"#708087\"\n                fontSize=\"12\"\n              \u003e\n                {fmt(v, 2)}\n              \u003c/text\u003e\n            \u003c/g\u003e\n          );\n        })}\n        \u003ctext\n          transform=\"translate(18 165) rotate(-90)\"\n          textAnchor=\"middle\"\n          fill=\"#708087\"\n          fontSize=\"12\"\n        \u003e\n          {label}\n        \u003c/text\u003e\n        {groups.map((g, i) =\u003e {\n          const values = result.points\n              .filter((p) =\u003e p.group === g)\n              .map((p) =\u003e p.value)\n              .sort((a, b) =\u003e a - b),\n            q1 = quantile(values, 0.25),\n            q3 = quantile(values, 0.75),\n            med = quantile(values, 0.5),\n            iqr = q3 - q1,\n            inside = values.filter(\n              (v) =\u003e v \u003e= q1 - 1.5 * iqr \u0026\u0026 v \u003c= q3 + 1.5 * iqr,\n            ),\n            lo = inside[0],\n            hi = inside[inside.length - 1],\n            x = 100 + ((i + 0.5) * 630) / groups.length,\n            color = colors[i % colors.length];\n          return (\n            \u003cg key={g}\u003e\n              \u003ctitle\u003e\n                {g +\n                  \" · n=\" +\n                  values.length +\n                  \" · 中位数 \" +\n                  fmt(med) +\n                  \" · Q1=\" +\n                  fmt(q1) +\n                  \" · Q3=\" +\n                  fmt(q3)}\n              \u003c/title\u003e\n              \u003cline\n                x1={x}\n                y1={y(lo)}\n                x2={x}\n                y2={y(hi)}\n                stroke={color}\n                strokeWidth=\"2\"\n              /\u003e\n              \u003cline\n                x1={x - 18}\n                y1={y(lo)}\n                x2={x + 18}\n                y2={y(lo)}\n                stroke={color}\n                strokeWidth=\"2\"\n              /\u003e\n              \u003cline\n                x1={x - 18}\n                y1={y(hi)}\n                x2={x + 18}\n                y2={y(hi)}\n                stroke={color}\n                strokeWidth=\"2\"\n              /\u003e\n              \u003crect\n                x={x - 40}\n                y={y(q3)}\n                width=\"80\"\n                height={Math.max(2, y(q1) - y(q3))}\n                fill={color}\n                fillOpacity=\".17\"\n                stroke={color}\n                strokeWidth=\"2\"\n                rx=\"4\"\n              /\u003e\n              \u003cline\n                x1={x - 40}\n                y1={y(med)}\n                x2={x + 40}\n                y2={y(med)}\n                stroke={color}\n                strokeWidth=\"3\"\n              /\u003e\n              {values\n                .filter((v) =\u003e v \u003c lo || v \u003e hi)\n                .map((v, j) =\u003e (\n                  \u003ccircle\n                    key={j}\n                    cx={x}\n                    cy={y(v)}\n                    r=\"4\"\n                    fill=\"white\"\n                    stroke={color}\n                  \u003e\n                    \u003ctitle\u003e{fmt(v)}\u003c/title\u003e\n                  \u003c/circle\u003e\n                ))}\n              \u003ctext\n                x={x}\n                y=\"307\"\n                textAnchor=\"middle\"\n                fill=\"#52676b\"\n                fontSize=\"13\"\n              \u003e\n                {g + \" (n=\" + values.length + \")\"}\n              \u003c/text\u003e\n            \u003c/g\u003e\n          );\n        })}\n      \u003c/svg\u003e\n    \u003c/div\u003e\n  );\n}\n", "lines": 1489, "sha256": "05bfd30f4bfb7a1a55a26abbaf9e99d1d875a28de28f630dccb8c498da7ef26e", "category": "前端", "definitions": [{"name": "FormEvent", "line": 7}, {"name": "Analysis", "line": 43}, {"name": "AnalysisConfig", "line": 44}, {"name": "Dataset", "line": 45}, {"name": "Experiment", "line": 46}, {"name": "Paper", "line": 47}, {"name": "Report", "line": 48}, {"name": "Result", "line": 49}, {"name": "Props", "line": 60}, {"name": "Experiments", "line": 83}, {"name": "selectedExperiment", "line": 112}, {"name": "detailRequest", "line": 114}, {"name": "loadDetail", "line": 115}, {"name": "request", "line": 118}, {"name": "d", "line": 119}, {"name": "dataset", "line": 161}, {"name": "update", "line": 162}, {"name": "groups", "line": 164}, {"name": "upload", "line": 174}, {"name": "fd", "line": 176}, {"name": "d", "line": 182}, {"name": "cleanData", "line": 198}, {"name": "d", "line": 202}, {"name": "run", "line": 226}, {"name": "a", "line": 231}, {"name": "suggest", "line": 245}, {"name": "r", "line": 248}, {"name": "createReport", "line": 268}, {"name": "selector", "line": 288}, {"name": "ExperimentForm", "line": 899}, {"name": "save", "line": 921}, {"name": "x", "line": 925}, {"name": "Quality", "line": 1024}, {"name": "quality", "line": 1025}, {"name": "columns", "line": 1026}, {"name": "duplicate", "line": 1029}, {"name": "AnalysisResult", "line": 1058}, {"name": "r", "line": 1066}, {"name": "quantile", "line": 1217}, {"name": "pos", "line": 1218}, {"name": "InteractivePlot", "line": 1225}, {"name": "groups", "line": 1236}, {"name": "colors", "line": 1237}, {"name": "label", "line": 1238}, {"name": "data", "line": 1241}, {"name": "values", "line": 1299}, {"name": "bins", "line": 1302}, {"name": "index", "line": 1308}, {"name": "key", "line": 1310}, {"name": "all", "line": 1346}, {"name": "y", "line": 1351}, {"name": "v", "line": 1357}, {"name": "values", "line": 1389}], "source_page": "source/33.md"}, {"path": "frontend/src/api.ts", "content": "import { formatNumber } from \"./numeric\";\nexport type Project = {\n  id: string;\n  name: string;\n  question: string;\n  hypothesis: string;\n  tags: string[];\n  notes: string;\n  archived: boolean;\n};\nexport type Paper = {\n  id: string;\n  title: string;\n  authors: string;\n  year: number | null;\n  doi: string;\n  tags: string[];\n  reading_status: string;\n  notes: string;\n  status: string;\n  error?: string;\n  filename: string;\n  size_bytes: number;\n  page_count: number;\n  created_at: string;\n  pages?: { page_number: number; text: string }[];\n};\nexport type Citation = {\n  paper_id: string;\n  chunk_id: string;\n  title: string;\n  page_number: number;\n  quote: string;\n  score?: number;\n};\nexport type Job = {\n  id: string;\n  kind: string;\n  status: string;\n  error?: string;\n  resource_id: string;\n  created_at: string;\n};\nexport type Settings = {\n  chat_configured: boolean;\n  embedding_configured: boolean;\n  ai_enabled: boolean;\n  chat_model: string;\n  embedding_model: string;\n  chat_base_url: string;\n  embedding_base_url: string;\n  limits: Record\u003cstring, unknown\u003e;\n};\nexport type Dataset = {\n  id: string;\n  filename: string;\n  sha256: string;\n  parent_id?: string;\n  sheet?: string;\n  sheets: string[];\n  columns: string[];\n  row_count: number;\n  preview: Record\u003cstring, unknown\u003e[];\n  quality: Record\u003cstring, unknown\u003e;\n  transform: Record\u003cstring, unknown\u003e;\n  created_at: string;\n};\nexport type AnalysisConfig = {\n  group_column: string;\n  metric_column: string;\n  group_a: string;\n  group_b: string;\n  design: \"descriptive\" | \"independent\" | \"paired\";\n  experimental_unit: string;\n  missing_policy: \"error\" | \"drop\";\n  alternative: \"two-sided\" | \"less\" | \"greater\";\n  pair_column?: string;\n  sample_id_column?: string;\n  unit: string;\n  direction: \"higher\" | \"lower\";\n  confirmed: boolean;\n};\nexport type Result = {\n  summary: {\n    group: string;\n    n: number;\n    mean: number | null;\n    median: number | null;\n    std: number | null;\n    min: number | null;\n    max: number | null;\n  }[];\n  comparison: {\n    difference?: number | null;\n    relative_change_percent?: number | null;\n    ci_low?: number | null;\n    ci_high?: number | null;\n    pvalue?: number | null;\n    statistic?: number | null;\n    df?: number | null;\n    method?: string;\n    status?: string;\n    reason?: string;\n  };\n  points: { group: string; value: number; pair_id?: string }[];\n  warnings: string[];\n  exclusions: unknown[];\n  config: AnalysisConfig;\n};\nexport type Analysis = {\n  id: string;\n  result: Result;\n  config: AnalysisConfig;\n  dataset_id: string;\n  created_at: string;\n};\nexport type Experiment = {\n  id: string;\n  name: string;\n  hypothesis: string;\n  paper_ids: string[];\n  conditions: string;\n  parameters: string;\n  notes: string;\n  datasets?: Dataset[];\n  analyses?: Analysis[];\n  created_at: string;\n};\nexport type Report = {\n  id: string;\n  title: string;\n  analysis_id: string;\n  markdown: string;\n  created_at: string;\n};\nexport type Message = {\n  role: string;\n  content: string;\n  citations: Citation[];\n  mode?: string;\n};\nexport type Conversation = { id: string; title?: string; messages: Message[] };\nexport type ReadingField = {\n  name: string;\n  text: string;\n  citations: Citation[];\n};\nexport const fmt = formatNumber;\nexport const date = (v: string) =\u003e\n  v\n    ? new Date(v).toLocaleString(\"zh-CN\", {\n        month: \"short\",\n        day: \"numeric\",\n        hour: \"2-digit\",\n        minute: \"2-digit\",\n      })\n    : \"—\";\nexport async function api\u003cT = unknown\u003e(\n  path: string,\n  options: RequestInit = {},\n): Promise\u003cT\u003e {\n  const response = await fetch(\"/api\" + path, {\n    ...options,\n    headers:\n      options.body instanceof FormData\n        ? options.headers\n        : { \"Content-Type\": \"application/json\", ...options.headers },\n  });\n  if (!response.ok) {\n    let message = response.statusText;\n    try {\n      const body = await response.json();\n      message =\n        typeof body.detail === \"string\"\n          ? body.detail\n          : JSON.stringify(body.detail || body);\n    } catch {}\n    throw new Error(message || \"请求失败\");\n  }\n  if (response.status === 204) return undefined as T;\n  return response.json();\n}\nexport const json = (data: unknown): RequestInit =\u003e ({\n  method: \"POST\",\n  body: JSON.stringify(data),\n});\n", "lines": 186, "sha256": "be0d55d3af280b63e8f504a272667c771a71c1fd2957f7a6d06b1f8daa9674b0", "category": "前端", "definitions": [{"name": "Project", "line": 2}, {"name": "Paper", "line": 11}, {"name": "Citation", "line": 28}, {"name": "Job", "line": 36}, {"name": "Settings", "line": 44}, {"name": "Dataset", "line": 54}, {"name": "AnalysisConfig", "line": 68}, {"name": "Result", "line": 83}, {"name": "Analysis", "line": 110}, {"name": "Experiment", "line": 117}, {"name": "Report", "line": 129}, {"name": "Message", "line": 136}, {"name": "Conversation", "line": 142}, {"name": "ReadingField", "line": 143}, {"name": "fmt", "line": 148}, {"name": "date", "line": 149}, {"name": "api", "line": 158}, {"name": "response", "line": 162}, {"name": "message", "line": 170}, {"name": "body", "line": 172}, {"name": "json", "line": 183}], "source_page": "source/34.md"}, {"path": "frontend/src/components.tsx", "content": "import {\n  Children,\n  cloneElement,\n  isValidElement,\n  Fragment,\n  useId,\n  useEffect,\n  useRef,\n  useState,\n  type ReactNode,\n  type ReactElement,\n} from \"react\";\nimport {\n  X,\n  FileText,\n  LoaderCircle,\n  ArrowUpRight,\n  ChevronLeft,\n  ChevronRight,\n  Download,\n  BookOpen,\n  Save,\n} from \"lucide-react\";\nimport * as pdfjs from \"pdfjs-dist\";\nimport workerUrl from \"pdfjs-dist/build/pdf.worker.min.mjs?url\";\nimport {\n  api,\n  json,\n  type Paper,\n  type Citation,\n  type ReadingField,\n  fmt,\n} from \"./api\";\npdfjs.GlobalWorkerOptions.workerSrc = workerUrl;\nexport const statusLabel: Record\u003cstring, string\u003e = {\n  queued: \"排队中\",\n  running: \"处理中\",\n  completed: \"已就绪\",\n  failed: \"处理失败\",\n  interrupted: \"已中断\",\n  needs_ocr: \"需要 OCR\",\n  unread: \"未读\",\n  reading: \"阅读中\",\n  read: \"已读\",\n};\nexport function Badge({\n  children,\n  tone = \"neutral\",\n}: {\n  children: ReactNode;\n  tone?: string;\n}) {\n  return \u003cspan className={\"badge \" + tone}\u003e{children}\u003c/span\u003e;\n}\nexport function Empty({\n  title,\n  children,\n  action,\n}: {\n  title: string;\n  children?: ReactNode;\n  action?: ReactNode;\n}) {\n  return (\n    \u003cdiv className=\"empty\"\u003e\n      \u003cdiv className=\"empty-icon\"\u003e\n        \u003cBookOpen size={27} /\u003e\n      \u003c/div\u003e\n      \u003ch3\u003e{title}\u003c/h3\u003e\n      \u003cp\u003e{children}\u003c/p\u003e\n      {action}\n    \u003c/div\u003e\n  );\n}\nexport function Spinner({ label = \"正在加载…\" }: { label?: string }) {\n  return (\n    \u003cdiv className=\"loading\"\u003e\n      \u003cLoaderCircle className=\"spin\" size={18} /\u003e\n      {label}\n    \u003c/div\u003e\n  );\n}\nexport function Alert({\n  children,\n  tone = \"info\",\n}: {\n  children: ReactNode;\n  tone?: string;\n}) {\n  return \u003cdiv className={\"alert \" + tone}\u003e{children}\u003c/div\u003e;\n}\nexport function Field({\n  label,\n  children,\n  hint,\n}: {\n  label: string;\n  children: ReactNode;\n  hint?: string;\n}) {\n  const id = useId();\n  const nameControls = (nodes: ReactNode): ReactNode =\u003e\n    Children.map(nodes, (child) =\u003e {\n      if (!isValidElement(child)) return child;\n      const element = child as ReactElement\u003c{\n        children?: ReactNode;\n        \"aria-label\"?: string;\n        \"aria-labelledby\"?: string;\n        \"aria-describedby\"?: string;\n      }\u003e;\n      if (\n        typeof element.type === \"string\" \u0026\u0026\n        [\"input\", \"select\", \"textarea\"].includes(element.type)\n      ) {\n        if (element.props[\"aria-label\"] || element.props[\"aria-labelledby\"])\n          return element;\n        return cloneElement(element, {\n          \"aria-labelledby\": id,\n          \"aria-describedby\": hint ? id + \"-hint\" : undefined,\n        });\n      }\n      return element.type === Fragment\n        ? cloneElement(element, {}, nameControls(element.props.children))\n        : element;\n    });\n  return (\n    \u003clabel className=\"field\"\u003e\n      \u003cspan id={id}\u003e{label}\u003c/span\u003e\n      {nameControls(children)}\n      {hint \u0026\u0026 \u003csmall id={id + \"-hint\"}\u003e{hint}\u003c/small\u003e}\n    \u003c/label\u003e\n  );\n}\nexport function Modal({\n  title,\n  children,\n  onClose,\n  wide = false,\n}: {\n  title: string;\n  children: ReactNode;\n  onClose: () =\u003e void;\n  wide?: boolean;\n}) {\n  const ref = useRef\u003cHTMLDivElement\u003e(null);\n  useEffect(() =\u003e {\n    const old = document.body.style.overflow;\n    document.body.style.overflow = \"hidden\";\n    const key = (e: KeyboardEvent) =\u003e {\n      if (e.key === \"Escape\") onClose();\n      if (e.key === \"Tab\") {\n        const list = ref.current?.querySelectorAll\u003cHTMLElement\u003e(\n          \"button,input,select,textarea,a[href]\",\n        );\n        if (!list?.length) return;\n        const first = list[0],\n          last = list[list.length - 1];\n        if (e.shiftKey \u0026\u0026 document.activeElement === first) {\n          e.preventDefault();\n          last.focus();\n        } else if (!e.shiftKey \u0026\u0026 document.activeElement === last) {\n          e.preventDefault();\n          first.focus();\n        }\n      }\n    };\n    document.addEventListener(\"keydown\", key);\n    ref.current?.focus();\n    return () =\u003e {\n      document.body.style.overflow = old;\n      document.removeEventListener(\"keydown\", key);\n    };\n  }, [onClose]);\n  return (\n    \u003cdiv\n      className=\"modal-scrim\"\n      onMouseDown={(e) =\u003e {\n        if (e.target === e.currentTarget) onClose();\n      }}\n    \u003e\n      \u003cdiv\n        className={\"modal \" + (wide ? \"wide\" : \"\")}\n        role=\"dialog\"\n        aria-modal=\"true\"\n        aria-label={title}\n        tabIndex={-1}\n        ref={ref}\n      \u003e\n        \u003cdiv className=\"modal-head\"\u003e\n          \u003ch2\u003e{title}\u003c/h2\u003e\n          \u003cbutton className=\"icon-button\" aria-label=\"关闭\" onClick={onClose}\u003e\n            \u003cX size={20} /\u003e\n          \u003c/button\u003e\n        \u003c/div\u003e\n        {children}\n      \u003c/div\u003e\n    \u003c/div\u003e\n  );\n}\nexport function Citations({\n  items,\n  onSelect,\n}: {\n  items: Citation[];\n  onSelect: (c: Citation) =\u003e void;\n}) {\n  return (\n    \u003cdiv className=\"citations\"\u003e\n      {items.map((c, i) =\u003e (\n        \u003cbutton\n          key={c.chunk_id + \"-\" + i}\n          className=\"citation-button\"\n          title={c.quote}\n          onClick={() =\u003e onSelect(c)}\n        \u003e\n          \u003cFileText size={13} /\u003e\n          {i + 1} · {c.title} \u003cspan\u003ep.{c.page_number}\u003c/span\u003e\n        \u003c/button\u003e\n      ))}\n    \u003c/div\u003e\n  );\n}\nexport function Evidence({\n  citation,\n  onOpen,\n  onClose,\n}: {\n  citation: Citation;\n  onOpen: () =\u003e void;\n  onClose: () =\u003e void;\n}) {\n  return (\n    \u003caside className=\"evidence\"\u003e\n      \u003cdiv className=\"row between\"\u003e\n        \u003ch3\u003e证据原文\u003c/h3\u003e\n        \u003cbutton className=\"icon-button\" aria-label=\"收起证据\" onClick={onClose}\u003e\n          \u003cX size={17} /\u003e\n        \u003c/button\u003e\n      \u003c/div\u003e\n      \u003cBadge tone=\"teal\"\u003ePDF 第 {citation.page_number} 页\u003c/Badge\u003e\n      \u003ch4\u003e{citation.title}\u003c/h4\u003e\n      \u003cblockquote\u003e{citation.quote}\u003c/blockquote\u003e\n      \u003cp className=\"muted tiny\"\u003e\n        引用标识与原文经过匹配检查。引用存在并不代表结论已经得到充分证明。\n      \u003c/p\u003e\n      \u003cbutton className=\"button secondary full\" onClick={onOpen}\u003e\n        打开原文对应页\n        \u003cArrowUpRight size={15} /\u003e\n      \u003c/button\u003e\n    \u003c/aside\u003e\n  );\n}\nexport function Reader({\n  projectId,\n  paperId,\n  initialPage,\n  onClose,\n  onSave,\n  onCite,\n  notify,\n}: {\n  projectId: string;\n  paperId: string;\n  initialPage: number;\n  onClose: () =\u003e void;\n  onSave: () =\u003e void;\n  onCite: (c: Citation) =\u003e void;\n  notify: (s: string, error?: boolean) =\u003e void;\n}) {\n  const [paper, setPaper] = useState\u003cPaper | null\u003e(null),\n    [page, setPage] = useState(initialPage),\n    [loading, setLoading] = useState(true),\n    [error, setError] = useState(\"\"),\n    [tab, setTab] = useState(\"text\"),\n    [fields, setFields] = useState\u003cReadingField[]\u003e([]),\n    [busy, setBusy] = useState(false),\n    [pdfError, setPdfError] = useState(\"\");\n  const canvas = useRef\u003cHTMLCanvasElement\u003e(null);\n  const doc = useRef\u003cpdfjs.PDFDocumentProxy | null\u003e(null);\n  const url = \"/api/projects/\" + projectId + \"/papers/\" + paperId + \"/file\";\n  useEffect(() =\u003e {\n    let cancelled = false;\n    api\u003cPaper\u003e(`/projects/${projectId}/papers/${paperId}`)\n      .then((p) =\u003e {\n        if (!cancelled) setPaper(p);\n      })\n      .catch((e) =\u003e setError(e.message))\n      .finally(() =\u003e setLoading(false));\n    const task = pdfjs.getDocument({\n      url,\n      cMapUrl: \"/pdfjs/cmaps/\",\n      cMapPacked: true,\n      standardFontDataUrl: \"/pdfjs/standard_fonts/\",\n      isEvalSupported: false,\n    });\n    task.promise\n      .then((d) =\u003e {\n        if (cancelled) {\n          d.destroy();\n          return;\n        }\n        doc.current = d;\n        setPage((p) =\u003e Math.min(p, d.numPages));\n      })\n      .catch((e) =\u003e {\n        if (!cancelled) setPdfError(String(e.message));\n      });\n    return () =\u003e {\n      cancelled = true;\n      task.destroy();\n      doc.current = null;\n    };\n  }, [projectId, paperId, url]);\n  useEffect(() =\u003e {\n    if (!paper || !canvas.current) return;\n    let task: pdfjs.RenderTask | undefined;\n    let stopped = false;\n    async function render() {\n      try {\n        const d = doc.current;\n        if (!d) {\n          window.setTimeout(() =\u003e {\n            if (!stopped) render();\n          }, 150);\n          return;\n        }\n        const p = await d.getPage(page);\n        if (stopped || !canvas.current) return;\n        const viewport = p.getViewport({ scale: 1.35 });\n        const c = canvas.current;\n        c.height = viewport.height;\n        c.width = viewport.width;\n        const context = c.getContext(\"2d\");\n        if (context) {\n          task = p.render({ canvasContext: context, viewport });\n          await task.promise;\n        }\n      } catch (e) {\n        if (\n          !stopped \u0026\u0026\n          e instanceof Error \u0026\u0026\n          e.name !== \"RenderingCancelledException\"\n        )\n          setPdfError(e.message);\n      }\n    }\n    render();\n    return () =\u003e {\n      stopped = true;\n      task?.cancel();\n    };\n  }, [paper, page]);\n  const save = async () =\u003e {\n    if (!paper) return;\n    setBusy(true);\n    try {\n      await api(`/projects/${projectId}/papers/${paperId}`, {\n        method: \"PATCH\",\n        body: JSON.stringify({\n          title: paper.title,\n          authors: paper.authors,\n          year: paper.year,\n          doi: paper.doi,\n          tags: paper.tags,\n          reading_status: paper.reading_status,\n          notes: paper.notes,\n        }),\n      });\n      notify(\"论文信息已保存\");\n      onSave();\n    } catch (e) {\n      notify((e as Error).message, true);\n    } finally {\n      setBusy(false);\n    }\n  };\n  const readingCard = async () =\u003e {\n    setBusy(true);\n    try {\n      const r = await api\u003c{\n        fields: ReadingField[];\n        mode: string;\n        warnings: string[];\n      }\u003e(`/projects/${projectId}/papers/${paperId}/reading-card`, json({}));\n      setFields(r.fields);\n      setTab(\"card\");\n      r.warnings?.forEach((w) =\u003e notify(w));\n      if (r.mode === \"offline\")\n        notify(\"未配置模型：阅读卡仅展示已有原文，不代表 AI 总结\");\n    } catch (e) {\n      notify((e as Error).message, true);\n    } finally {\n      setBusy(false);\n    }\n  };\n  return (\n    \u003cModal title={paper?.title || \"论文阅读\"} onClose={onClose} wide\u003e\n      {loading ? (\n        \u003cSpinner /\u003e\n      ) : error ? (\n        \u003cAlert tone=\"error\"\u003e{error}\u003c/Alert\u003e\n      ) : (\n        paper \u0026\u0026 (\n          \u003cdiv className=\"reader\"\u003e\n            \u003cdiv className=\"pdf-pane\"\u003e\n              \u003cdiv className=\"pdf-toolbar\"\u003e\n                \u003cbutton\n                  className=\"icon-button\"\n                  aria-label=\"上一页\"\n                  disabled={page \u003c= 1}\n                  onClick={() =\u003e setPage(page - 1)}\n                \u003e\n                  \u003cChevronLeft size={18} /\u003e\n                \u003c/button\u003e\n                \u003clabel className=\"row\"\u003e\n                  第{\" \"}\n                  \u003cinput\n                    aria-label=\"PDF 页码\"\n                    type=\"number\"\n                    min=\"1\"\n                    max={paper.page_count || 1}\n                    value={page}\n                    onChange={(e) =\u003e\n                      setPage(\n                        Math.max(\n                          1,\n                          Math.min(\n                            paper.page_count || 1,\n                            Number(e.target.value) || 1,\n                          ),\n                        ),\n                      )\n                    }\n                  /\u003e{\" \"}\n                  / {paper.page_count || \"—\"} 页\n                \u003c/label\u003e\n                \u003cbutton\n                  className=\"icon-button\"\n                  aria-label=\"下一页\"\n                  disabled={page \u003e= (paper.page_count || 1)}\n                  onClick={() =\u003e setPage(page + 1)}\n                \u003e\n                  \u003cChevronRight size={18} /\u003e\n                \u003c/button\u003e\n                \u003ca\n                  className=\"icon-button\"\n                  href={url}\n                  target=\"_blank\"\n                  rel=\"noreferrer\"\n                  aria-label=\"下载原始 PDF\"\n                \u003e\n                  \u003cDownload size={17} /\u003e\n                \u003c/a\u003e\n              \u003c/div\u003e\n              \u003cdiv className=\"pdf-canvas\"\u003e\n                {pdfError ? (\n                  \u003cAlert tone=\"error\"\u003e\n                    PDF 预览失败：{pdfError}。可下载原始文件继续阅读。\n                  \u003c/Alert\u003e\n                ) : (\n                  \u003ccanvas ref={canvas} aria-label={\"PDF 第 \" + page + \" 页\"} /\u003e\n                )}\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"reader-info\"\u003e\n              \u003cdiv className=\"tabs small-tabs\"\u003e\n                {[\n                  [\"text\", \"逐页文本\"],\n                  [\"metadata\", \"信息笔记\"],\n                  [\"card\", \"阅读卡\"],\n                ].map(([k, t]) =\u003e (\n                  \u003cbutton\n                    className={tab === k ? \"active\" : \"\"}\n                    key={k}\n                    onClick={() =\u003e setTab(k)}\n                  \u003e\n                    {t}\n                  \u003c/button\u003e\n                ))}\n              \u003c/div\u003e\n              {tab === \"text\" ? (\n                \u003c\u003e\n                  \u003cp className=\"eyebrow\"\u003eEXTRACTED TEXT / 第 {page} 页\u003c/p\u003e\n                  \u003cp className=\"text-preview\"\u003e\n                    {paper.pages?.find((p) =\u003e p.page_number === page)?.text ||\n                      \"本页未提取到文本。扫描页面需要 OCR。\"}\n                  \u003c/p\u003e\n                \u003c/\u003e\n              ) : tab === \"metadata\" ? (\n                \u003cdiv className=\"form-grid single\"\u003e\n                  \u003cField label=\"标题\"\u003e\n                    \u003cinput\n                      value={paper.title}\n                      onChange={(e) =\u003e\n                        setPaper({ ...paper, title: e.target.value })\n                      }\n                    /\u003e\n                  \u003c/Field\u003e\n                  \u003cField label=\"作者\"\u003e\n                    \u003cinput\n                      value={paper.authors || \"\"}\n                      onChange={(e) =\u003e\n                        setPaper({ ...paper, authors: e.target.value })\n                      }\n                    /\u003e\n                  \u003c/Field\u003e\n                  \u003cdiv className=\"form-grid\"\u003e\n                    \u003cField label=\"年份\"\u003e\n                      \u003cinput\n                        type=\"number\"\n                        min=\"1000\"\n                        max=\"2200\"\n                        value={paper.year || \"\"}\n                        onChange={(e) =\u003e\n                          setPaper({\n                            ...paper,\n                            year: e.target.value\n                              ? Number(e.target.value)\n                              : null,\n                          })\n                        }\n                      /\u003e\n                    \u003c/Field\u003e\n                    \u003cField label=\"阅读状态\"\u003e\n                      \u003cselect\n                        value={paper.reading_status || \"unread\"}\n                        onChange={(e) =\u003e\n                          setPaper({ ...paper, reading_status: e.target.value })\n                        }\n                      \u003e\n                        \u003coption value=\"unread\"\u003e未读\u003c/option\u003e\n                        \u003coption value=\"reading\"\u003e阅读中\u003c/option\u003e\n                        \u003coption value=\"read\"\u003e已读\u003c/option\u003e\n                      \u003c/select\u003e\n                    \u003c/Field\u003e\n                  \u003c/div\u003e\n                  \u003cField label=\"DOI\"\u003e\n                    \u003cinput\n                      value={paper.doi || \"\"}\n                      onChange={(e) =\u003e\n                        setPaper({ ...paper, doi: e.target.value })\n                      }\n                    /\u003e\n                  \u003c/Field\u003e\n                  \u003cField label=\"标签（逗号分隔）\"\u003e\n                    \u003cinput\n                      value={(paper.tags || []).join(\",\")}\n                      onChange={(e) =\u003e\n                        setPaper({\n                          ...paper,\n                          tags: e.target.value.split(/[,，]/).filter(Boolean),\n                        })\n                      }\n                    /\u003e\n                  \u003c/Field\u003e\n                  \u003cField label=\"阅读笔记\"\u003e\n                    \u003ctextarea\n                      rows={6}\n                      value={paper.notes || \"\"}\n                      onChange={(e) =\u003e\n                        setPaper({ ...paper, notes: e.target.value })\n                      }\n                    /\u003e\n                  \u003c/Field\u003e\n                  \u003cbutton\n                    className=\"button primary\"\n                    disabled={busy}\n                    onClick={save}\n                  \u003e\n                    \u003cSave size={15} /\u003e\n                    保存信息\n                  \u003c/button\u003e\n                \u003c/div\u003e\n              ) : (\n                \u003c\u003e\n                  \u003cbutton\n                    className=\"button secondary full\"\n                    disabled={busy}\n                    onClick={readingCard}\n                  \u003e\n                    {busy ? (\n                      \u003cLoaderCircle size={15} className=\"spin\" /\u003e\n                    ) : (\n                      \u003cBookOpen size={15} /\u003e\n                    )}\n                    生成结构化阅读卡\n                  \u003c/button\u003e\n                  \u003cp className=\"tiny muted\"\u003e\n                    研究问题、方法、数据、实验设置、主要结果和局限。缺失内容明确标注。\n                  \u003c/p\u003e\n                  {fields.map((f, i) =\u003e (\n                    \u003csection className=\"reading-field\" key={i}\u003e\n                      \u003ch4\u003e{f.name}\u003c/h4\u003e\n                      \u003cp className=\"prewrap\"\u003e{f.text}\u003c/p\u003e\n                      \u003cCitations\n                        items={f.citations || []}\n                        onSelect={(c) =\u003e {\n                          setPage(c.page_number);\n                          onCite(c);\n                        }}\n                      /\u003e\n                    \u003c/section\u003e\n                  ))}\n                \u003c/\u003e\n              )}\n            \u003c/div\u003e\n          \u003c/div\u003e\n        )\n      )}\n    \u003c/Modal\u003e\n  );\n}\nexport function DataTable({\n  rows,\n  columns,\n  max = 15,\n}: {\n  rows: Record\u003cstring, unknown\u003e[];\n  columns: string[];\n  max?: number;\n}) {\n  return (\n    \u003cdiv className=\"table-scroll\"\u003e\n      \u003ctable\u003e\n        \u003cthead\u003e\n          \u003ctr\u003e\n            {columns.map((c) =\u003e (\n              \u003cth key={c}\u003e{c}\u003c/th\u003e\n            ))}\n          \u003c/tr\u003e\n        \u003c/thead\u003e\n        \u003ctbody\u003e\n          {rows.slice(0, max).map((r, i) =\u003e (\n            \u003ctr key={i}\u003e\n              {columns.map((c) =\u003e (\n                \u003ctd key={c} title={String(r[c] ?? \"\")}\u003e\n                  {r[c] == null ? (\n                    \u003cspan className=\"muted\"\u003e缺失\u003c/span\u003e\n                  ) : typeof r[c] === \"object\" ? (\n                    JSON.stringify(r[c])\n                  ) : (\n                    fmt(r[c])\n                  )}\n                \u003c/td\u003e\n              ))}\n            \u003c/tr\u003e\n          ))}\n        \u003c/tbody\u003e\n      \u003c/table\u003e\n      {!rows.length \u0026\u0026 \u003cp className=\"muted pad\"\u003e暂无记录\u003c/p\u003e}\n    \u003c/div\u003e\n  );\n}\n", "lines": 653, "sha256": "0884bc41bdb0a4cd1116e6807fb85968d2c4cdeadb3d83ab71afbff89aefd130", "category": "前端", "definitions": [{"name": "ReactNode", "line": 10}, {"name": "ReactElement", "line": 11}, {"name": "Paper", "line": 29}, {"name": "Citation", "line": 30}, {"name": "ReadingField", "line": 31}, {"name": "Badge", "line": 46}, {"name": "Empty", "line": 55}, {"name": "Spinner", "line": 75}, {"name": "Alert", "line": 83}, {"name":  scientific measurement or p value into a displayed zero.\n  if (magnitude \u003c 10 ** -precision || magnitude \u003e= 1e9) {\n    const [mantissa, exponent] = value\n      .toExponential(Math.max(0, precision - 1))\n      .split(\"e\");\n    const power = Number(exponent);\n    return String(Number(mantissa)) + \"e\" + (power \u003e= 0 ? \"+\" : \"\") + power;\n  }\n  return value.toLocaleString(\"zh-CN\", { maximumFractionDigits: precision });\n}\n\nexport type HistogramBin = {\n  index: number;\n  lo: number;\n  hi: number;\n  count: number;\n  range: string;\n};\n\nexport type Histogram = {\n  min: number | null;\n  max: number | null;\n  total: number;\n  bins: HistogramBin[];\n  /** One entry per original value; -1 marks an excluded nonfinite value. */\n  binIndices: number[];\n};\n\n/**\n * Equal-width bins. Interior bins are [lo, hi); the final bin includes max.\n * Values are assigned once by index, rather than tested against rounded edges.\n * Constant data returns one bin. Nonfinite inputs are explicitly omitted.\n */\nexport function makeHistogram(values: number[], count: number): Histogram {\n  if (!Number.isInteger(count) || count \u003c 1 || count \u003e 1000) {\n    throw new RangeError(\n      \"Histogram bin count must be an integer from 1 to 1000.\",\n    );\n  }\n  let min = Infinity;\n  let max = -Infinity;\n  let total = 0;\n  for (const value of values) {\n    if (!Number.isFinite(value)) continue;\n    if (value \u003c min) min = value;\n    if (value \u003e max) max = value;\n    total++;\n  }\n  const binIndices = Array\u003cnumber\u003e(values.length).fill(-1);\n  if (!total) return { min: null, max: null, total: 0, bins: [], binIndices };\n\n  const binCount = min === max ? 1 : count;\n  const span = max - min;\n  const scale = Math.max(Math.abs(min), Math.abs(max)) || 1;\n  const scaledMin = min / scale;\n  const scaledSpan = max / scale - scaledMin;\n  const boundary = (index: number): number =\u003e {\n    if (index === 0) return min;\n    if (index === binCount) return max;\n    const fraction = index / binCount;\n    // Convex interpolation also works when max - min overflows to Infinity.\n    return Number.isFinite(span)\n      ? min + span * fraction\n      : min * (1 - fraction) + max * fraction;\n  };\n  const bins: HistogramBin[] = Array.from({ length: binCount }, (_, index) =\u003e {\n    const lo = boundary(index);\n    const hi = boundary(index + 1);\n    return {\n      index,\n      lo,\n      hi,\n      count: 0,\n      range: formatNumber(lo) + \"–\" + formatNumber(hi),\n    };\n  });\n\n  for (let position = 0; position \u003c values.length; position++) {\n    const value = values[position];\n    if (!Number.isFinite(value)) continue;\n    let index = 0;\n    if (binCount \u003e 1) {\n      if (value === max) {\n        // Include max even when floating arithmetic puts the last edge just below it.\n        index = binCount - 1;\n      } else if (value !== min) {\n        const fraction =\n          Number.isFinite(span) \u0026\u0026 span \u003e 0\n            ? (value - min) / span\n            : (value / scale - scaledMin) / scaledSpan;\n        index = Math.max(\n          0,\n          Math.min(binCount - 1, Math.floor(fraction * binCount)),\n        );\n      }\n    }\n    bins[index].count++;\n    binIndices[position] = index;\n  }\n  return { min, max, total, bins, binIndices };\n}\n", "lines": 112, "sha256": "e813794a6a09db8924e03a143177f20c45db6aa9b28a9634941537dfb438cde6", "category": "前端", "definitions": [{"name": "formatNumber", "line": 2}, {"name": "precision", "line": 8}, {"name": "magnitude", "line": 11}, {"name": "power", "line": 17}, {"name": "HistogramBin", "line": 23}, {"name": "Histogram", "line": 31}, {"name": "makeHistogram", "line": 45}, {"name": "min", "line": 51}, {"name": "max", "line": 52}, {"name": "total", "line": 53}, {"name": "binIndices", "line": 60}, {"name": "binCount", "line": 63}, {"name": "span", "line": 64}, {"name": "scale", "line": 65}, {"nam  expect(histogram.binIndices.every((index) =\u003e index \u003e= 0 \u0026\u0026 index \u003c 3)).toBe(\n    true,\n  );\n});\n\ntest(\"interior boundaries have one assignment and final boundary is inclusive\", () =\u003e {\n  const histogram = makeHistogram([0, 1, 2, 3, 4], 4);\n  expect(histogram.binIndices).toEqual([0, 1, 2, 3, 3]);\n  expect(histogram.bins.map((bin) =\u003e bin.count)).toEqual([1, 1, 1, 2]);\n});\n\ntest(\"100000 observations do not use array spread arguments\", () =\u003e {\n  const values = Array.from({ length: 100000 }, (_, index) =\u003e index / 1000);\n  const histogram = makeHistogram(values, 12);\n  expect(histogram.min).toBe(0);\n  expect(histogram.max).toBe(99.999);\n  expect(histogram.total).toBe(100000);\n  expect(histogram.bins.reduce((sum, bin) =\u003e sum + bin.count, 0)).toBe(100000);\n  expect(histogram.binIndices.at(-1)).toBe(11);\n});\n\ntest(\"extreme finite numbers and subnormal ranges remain assigned\", () =\u003e {\n  for (const values of [\n    [-1e308, -5e307, 0, 5e307, 1e308],\n    [0, Number.MIN_VALUE, 2 * Number.MIN_VALUE],\n  ]) {\n    const histogram = makeHistogram(values, 4);\n    expect(histogram.bins.reduce((sum, bin) =\u003e sum + bin.count, 0)).toBe(\n      values.length,\n    );\n    expect(\n      histogram.bins.every(\n        (bin) =\u003e Number.isFinite(bin.lo) \u0026\u0026 Number.isFinite(bin.hi),\n      ),\n    ).toBe(true);\n    expect(\n      histogram.binIndices.every(\n        (index) =\u003e Number.isInteger(index) \u0026\u0026 index \u003e= 0 \u0026\u0026 index \u003c 4,\n      ),\n    ).toBe(true);\n  }\n});\n\ntest(\"constant, empty and invalid values are explicit\", () =\u003e {\n  const constant = makeHistogram([7, 7, 7], 3);\n  expect(constant.bins).toHaveLength(1);\n  expect(constant.bins[0].count).toBe(3);\n  expect(constant.binIndices).toEqual([0, 0, 0]);\n  expect(makeHistogram([], 3)).toEqual({\n    min: null,\n    max: null,\n    total: 0,\n    bins: [],\n    binIndices: [],\n  });\n  co TMLCanvasElement).width),\n    )\n    .toBeGreaterThan(100);\n  await expect(reader.getByText(/PDF 预览失败/)).toHaveCount(0);\n  await reader.getByRole(\"button\", { name: \"关闭\", exact: true }).click();\n\n  await nav(page, \"科研问答\");\n  await page\n    .getByRole(\"textbox\", { name: \"研究问题\", exact: true })\n    .fill(\"均值差\");\n  await page.getByRole(\"button\", { name: \"发送问题\", exact: true }).click();\n  await expect(\n    page.getByText(\"原文检索 · 非 AI 总结\", { exact: true }),\n  ).not.toHaveCount(0);\n  await expect(\n    page.locator(\".chat-message.assistant .citation-button\"),\n  ).not.toHaveCount(0);\n  await page\n    .getByRole(\"textbox\", { name: \"研究问题\", exact: true })\n    .fill(\"Europa orbital eccentricity\");\n  await page.getByRole(\"button\", { name: \"发送问题\", exact: true }).click();\n  await expect(page.getByText(/当前资料不足以支持该结论/)).toBeVisible();\n\n  await nav(page, \"文献对比\");\n  await page.locator(\".select-paper input\").nth(0).check();\n  await page.locator(\".select-paper input\").nth(1).check();\n  await page.getByRole(\"button\", { name: \"生成对比表\", exact: true }).click();\n  await expect(page.locator(\".comparison-column\")).toHaveCount(2);\n  await expect(page.locator(\".comparison-grid\")).toContainText(\n    \"未配置或未启用模型\",\n  );\n\n  await nav(page, \"实验分析\");\n  await page.getByRole(\"button\", { name: \"新建实验\", exact: true }).click();\n  const form = page.getByRole(\"dialog\", { name: \"创建实验记录\" });\n  await form.getByLabel(\"实验名称\", { exact: true }).fill(\"浏览器实验\");\n  await form\n    .getByLabel(\"研究假设\", { exact: true })\n    .fill(\"人工构造数据，用于验证 B-A=2。\");\n  await form.getByRole(\"button\", { name: \"创建实验\", exact: true }).click();\n  await expect(form).toBeHidden();\n  await page\n    .getByLabel(\"实验数据文件\")\n    .setInputFiles(sample(\"independent.csv\"));\n  await page.getByRole(\"button\", { name: \"导入为新版本\", exact: true }).click();\n  await expect(\n    page.getByRole(\"heading\", { name: \"明确分析设计\" }),\n  ).toBeVisible();\n  await page.getByLabel(\"分组列\", { exact: true }).selectOption(\"group\");\n  await page.getByLabel(\"主要指标列\", { exact: true }).selectOption(\"score\");\n  await page.getByLabel(\"指标单位\", { exact: true }).fill(\"分\");\n  await page.getByLabel(\"基准组 A\", { exact: true }).fill(\"A\");\n  await page.getByLabel(\"比较组 B\", { exact: true }).fill(\"B\");\n  await page\n    .getByLabel(\"分析设计\", { exact: true })\n    .selectOption(\"independent\");\n  await page.getByRole(\"textbox\", { name: /^实验单位/ }).fill(\"独立实验样本\");\n  await page\n    .getByLabel(\"实验单位 / 样本 ID 列\", { exact: true })\n    .selectOption(\"sample_id\");\n  await expect(\n    page.getByRole(\"button\", { name: \"运行并保存分析\", exact: true }),\n  ).toBeDisabled();\n  await page.getByRole(\"checkbox\", { name: /我已核对数据版本/ }).check();\n  const computed = page.waitForResponse(\n    (r) =\u003e r.url().endsWith(\"/analyses\") \u0026\u0026 r.request().method() === \"POST\",\n  );\n  await page\n    .getByRole(\"button\", { name: \"运行并保存分析\", exact: true })\n    .click();\n  const saved = await (await computed).json();\n  expect(saved.result.comparison.difference).toBe(2);\n  expect(saved.result.comparison.pvalue).toBeCloseTo(0.08051623795726257, 12);\n  expect(saved.result.summary.map((x: { n: number }) =\u003e x.n)).toEqual([5, 5]);\n  await expect(page.locator(\".result-stats .number\").nth(0)).toHaveText(\"2\");\n  await page.getByRole(\"button\", { name: \"箱线图\", exact: true }).click();\n  await expect(\n    page.getByRole(\"img\", { name: \"score (分) 箱线图\" }),\n  ).toBeVisible();\n  await page.getByRole(\"button\", { name: \"分布图\", exact: true }).click();\n  await expect(page.locator(\".recharts-bar\")).toHaveCount(2);\n  await page.getByRole(\"button\", { name: \"生成研究报告\", exact: true }).click();\n  await expect(\n    page.getByRole(\"heading\", { name: \"本次实验结果\", exact: true }),\n  ).toBeVisible();\n  await expect(page.locator(\".rendered-report img\")).toHaveCount(3);\n  await expect\n    .poll(() =\u003e\n      page\n        .locator(\".rendered-report img\")\n        .first()\n        .evaluate((el) =\u003e (el as HTMLImageElement).naturalWidth),\n    )\n    .toBeGreaterThan(100);\n  const download = page.waitForEvent(\"download\");\n  await page.getByRole(\"link\", { name: \"完整复现包\", exact: true }).click();\n  const file = await download;\n  const archive = info.outputPath(\"research-report.zip\");\n  await file.saveAs(archive);\n  expect((await readFile(archive)).subarray(0, 2).toString()).toBe(\"PK\");\n  await nav(page, \"实验分析\");\n  await page.getByRole(\"button\", { name: /分析结果/ }).click();\n  await mkdir(path.join(root, \"docs\"), { recursive: true });\n  await page.screenshot({\n    path: path.join(root, \"docs\", \"workbench-preview.png\"),\n    fullPage: true,\n  });\n  expect(external).toEqual([]);\n  expect(pageErrors).toEqual([]);\n});\n\ntest(\"project switching isolates documents and displays OCR/failure states\", async ({\n  page,\n}) =\u003e {\n  await page.goto(\"/\");\n  await createProject(page, \"浏览器验收 · 隔离与失败\");\n  await nav(page, \"论文知识库\");\n  await expect(\n    page.getByText(\"建立你的第一份文献证据\", { exact: true }),\n  ).toBeVisible();\n  await page\n    .getByLabel(\"上传 PDF\", { exact: true })\n    .setInputFiles([sample(\"scanned_demo.pdf\"), sample(\"corrupt_demo.pdf\")]);\n  await expect(page.getByText(\"需要 OCR\", { exact: true })).toBeVisible();\n  await expect(page.getByText(\"处理失败\", { exact: true })).toBeVisible();\n  await page.getByLabel(\"论文检索词\").fill(\"均值差\");\n  await page.getByRole(\"button\", { name: \"检索原文\", exact: true }).click();\n  await expect(\n    page.getByText(\"没有找到匹配的原文\", { exact: true }),\n  ).toBeVisible();\n});\n\ntest(\"mobile navigation stays within viewport and opens settings without a model\", async ({\n  page,\n}) =\u003e {\n  await page.setViewportSize({ width: 390, height: 844 });\n  await page.goto(\"/\");\n  await page.getByRole(\"button\", { name: \"打开导航\", exact: true }).click();\n  await nav(page, \"模型与设置\");\n  await expect(\n    page.getByRole(\"heading\", { name: \"外部 AI 模型\", exact: true }),\n  ).toBeVisible();\n  await expect(\n    page.getByRole(\"button\", { name: \"同意并启用 AI\", exact: true }),\n  ).toBeDisabled();\n  expect(\n    await page.evaluate(\n      () =\u003e document.documentElement.scrollWidth \u003c= window.innerWidth + 1,\n    ),\n  ).toBe(true);\n});\n", "lines": 209, "sha256": "66760fa3a976e20bd7bd88fcb63e7a53288fa90b4fcede2ddb8e187ae2958237", "category": "测试", "definitions": [{"name": "root", "line": 5}, {"name": "sample", "line": 6}, {"name": "createProject", "line": 8}, {"name": "dialog", "line": 10}, {"name": "nav", "line": 22}, {"name": "complete offline research workflow with original PDF and reproducible export", "line": 25}, {"name": "reader", "line": 53}, {"name": "form", "line": 93}, {"name": "computed", "line": 123}, {"name": "saved", "line": 129}, {"name": "download", "line": 153}, {"name": "file", "line": 155}, {"name": "archive", "line": 156}, {"name": "project switching isolates documents and displays OCR/failure states", "line": 170}, {"name": "mobile navigation stays within viewport and opens settings without a model", "line": 191}], "source_page": "source/42.md"}, {"path": "frontend/tsconfig.json", "content": "{\n  \"compilerOptions\": {\n    \"target\": \"ES2022\",\n    \"useDefineForClassFields\": true,\n    \"lib\": [\"ES2022\", \"DOM\", \"DOM.Iterable\"],\n    \"module\": \"ESNext\",\n    \"skipLibCheck\": true,\n    \"moduleResolution\": \"Bundler\",\n    \"allowImportingTsExtensions\": true,\n    \"resolveJsonModule\": true,\n    \"isolatedModules\": true,\n    \"noEmit\": true,\n    \"jsx\": \"react-jsx\",\n    \"strict\": true\n  },\n  \"include\": [\"src\"]\n}\n", "lines": 17, "sha256": "073d540e5cbb79b62d8709aa1ba04fd8f8a2a69e78965c8602ce4e18c1e4ef24", "category": "配置", "definitions": [], "source_page": "source/43.md"}, {"path": "frontend/vite.config.ts", "content": "import { defineConfig } from \"vite\";\nimport react
